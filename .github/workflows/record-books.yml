# Saves one order book snapshot of the open daily BTC strike markets every
# 30 minutes and commits it to the `data` branch (created on first run).
#
# Minutes: each run bills at least 1 minute. Every 30 min is ~1,440 min/month,
# inside the 2,000 free minutes of a private repo on the Free plan. On a public
# repo minutes are free, so "*/15" or "*/10" works there.
# GitHub may start scheduled runs late or skip them when it is busy, and it
# pauses schedules on repos with no activity for 60 days.

name: record-books

on:
  schedule:
    - cron: "7,37 * * * *"   # off the hour, when GitHub's scheduler is less busy
  workflow_dispatch: {}       # "Run workflow" button for a manual snapshot

permissions:
  contents: write

concurrency:
  group: record-books
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          path: code

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: code/pyproject.toml

      - name: Install
        run: pip install ./code

      - name: Take snapshot
        run: pmengine record --asset bitcoin --days-ahead 1 --out "$RUNNER_TEMP/books"

      - name: Commit to the data branch
        env:
          REPO_URL: https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
        run: |
          if git clone --quiet --depth 1 --branch data "$REPO_URL" store; then
            cd store
          else
            mkdir store && cd store
            git init --quiet
            git checkout --quiet --orphan data
            git remote add origin "$REPO_URL"
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p books
          cp -r "$RUNNER_TEMP/books/." books/
          git add books
          git commit --quiet -m "books snapshot $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          for i in 1 2 3; do
            git push --quiet origin data && exit 0
            git pull --quiet --rebase origin data || true
          done
          exit 1
