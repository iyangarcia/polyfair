# Saves one order book snapshot of the open daily BTC strike markets every
# 15 minutes and commits it to the `data` branch (created on first run).
#
# Minutes: each run bills at least 1 minute, ~2,900 min/month at this rate.
# That is free on a public repo; on a private one (2,000 free minutes on the
# Free plan) use "7,37 * * * *" instead.
# GitHub may start scheduled runs late or skip them when it is busy, and it
# pauses schedules on repos with no activity for 60 days.

name: record-books

on:
  schedule:
    - cron: "7,22,37,52 * * * *"   # off the hour, when GitHub's scheduler is less busy
  workflow_dispatch: {}       # "Run workflow" button for a manual snapshot

permissions:
  contents: write

concurrency:
  group: record-books
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          path: code

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: code/pyproject.toml

      - name: Install
        run: pip install ./code

      - name: Take snapshot
        run: pmengine record --asset bitcoin --days-ahead 1 --out "$RUNNER_TEMP/books"

      - name: Commit to the data branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash code/.github/scripts/push-data.sh "$RUNNER_TEMP/books" books "books snapshot $(date -u +%Y-%m-%dT%H:%M:%SZ)"
