# One day of paper trading (never live) with paper.yaml: today's BTC strike
# ladder, last ~6 hours before the noon New York expiry. State (fill log,
# run markers, summary.csv, logs) lives in paper/ on the `data` branch and is
# restored at the start of each run, so results accumulate day by day.
#
# Expiry is 16:00 UTC in summer and 17:00 UTC in winter, so the job starts
# twice; `pmengine paper-day` trades only from the start that is 5-6 hours
# before today's expiry and the other exits in seconds. A run lasts up to
# ~5h55, inside GitHub's 6-hour job limit. Use a public repo: a private one
# would use ~180 of its 2,000 free minutes every day.

name: paper-trade

on:
  schedule:
    - cron: "5 10 * * *"   # summer (expiry 16:00 UTC)
    - cron: "5 11 * * *"   # winter (expiry 17:00 UTC)
  workflow_dispatch:
    inputs:
      force:
        description: "Run now even outside the window (ignores the already-ran marker)"
        type: boolean
        default: false
      max_minutes:
        description: "Stop after this many minutes (blank: until expiry)"
        type: string
        default: ""

permissions:
  contents: write

concurrency:
  group: paper-trade
  cancel-in-progress: false

jobs:
  paper-day:
    runs-on: ubuntu-latest
    timeout-minutes: 358
    steps:
      - uses: actions/checkout@v4
        with:
          path: code

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: code/pyproject.toml

      - name: Install
        run: pip install ./code

      - name: Restore paper state from the data branch
        env:
          REPO_URL: https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
        run: |
          mkdir -p code/data/paper
          if git clone --quiet --depth 1 --branch data "$REPO_URL" "$RUNNER_TEMP/restore" 2>/dev/null \
             && [ -d "$RUNNER_TEMP/restore/paper" ]; then
            cp -r "$RUNNER_TEMP/restore/paper/." code/data/paper/
            echo "restored: $(ls code/data/paper | tr '\n' ' ')"
          else
            echo "no saved paper state yet: starting fresh"
          fi

      - name: Paper-trade today's ladder
        id: run
        working-directory: code
        run: |
          set -o pipefail
          mkdir -p data/paper/logs
          log="data/paper/logs/$(date -u +%Y-%m-%d_%H%M).log"
          args=()
          if [ "${{ inputs.force }}" = "true" ]; then args+=(--force); fi
          if [ -n "${{ inputs.max_minutes }}" ]; then args+=(--max-minutes "${{ inputs.max_minutes }}"); fi
          pmengine paper-day --config paper.yaml --state-dir data/paper "${args[@]}" 2>&1 | tee "$log"
          if grep -q '^skip:' "$log"; then
            rm "$log"
            echo "skipped=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Save paper state to the data branch
        if: always() && steps.run.outputs.skipped != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash code/.github/scripts/push-data.sh code/data/paper paper "paper day $(date -u +%Y-%m-%d)"

      - name: Summary
        if: always() && steps.run.outputs.skipped != 'true'
        run: |
          {
            echo "### Paper trading"
            echo '```'
            cat code/data/paper/summary.csv 2>/dev/null | tail -15 || echo "no summary yet"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
