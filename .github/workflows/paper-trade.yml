# One day of paper trading (never live) with paper.yaml: today's BTC strike
# ladder, last ~6 hours before the noon New York expiry. State (fill log,
# run markers, summary.csv, logs) lives in paper/ on the `data` branch and is
# restored at the start of each run, so results accumulate day by day.
# Manual runs are tests: they use paper-test/ and never touch paper/.
#
# Expiry is 16:00 UTC in summer and 17:00 UTC in winter. GitHub starts
# scheduled jobs hours late (6-8 h was seen for the old 10:05/11:05 crons),
# so the job is scheduled every hour of the day and `pmengine paper-day`
# decides: the first start that lands 1-6 hours before today's expiry trades
# until expiry, and every other start exits in about a minute (the day's
# marker stops repeats). A late start trades a shorter day; summary.csv has a
# `minutes` column for that. A run lasts up to ~5h55, inside GitHub's 6-hour
# job limit. Use a public repo: a private one would burn its free minutes.

name: paper-trade

on:
  schedule:
    - cron: "41 * * * *"   # every hour, off the busy :00; paper-day picks the start
  workflow_dispatch:
    inputs:
      force:
        description: "Run now even outside the window (ignores the already-ran marker)"
        type: boolean
        default: false
      max_minutes:
        description: "Stop after this many minutes (blank: until expiry)"
        type: string
        default: ""

permissions:
  contents: write

concurrency:
  group: paper-trade
  cancel-in-progress: false

jobs:
  paper-day:
    runs-on: ubuntu-latest
    timeout-minutes: 358
    env:
      # Only scheduled runs build the real record in paper/. Any manual run
      # ("Run workflow") is a test and keeps its own state in paper-test/.
      STATE: ${{ github.event_name == 'schedule' && 'paper' || 'paper-test' }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: code

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: code/pyproject.toml

      - name: Install
        run: pip install ./code

      - name: Restore paper state from the data branch
        env:
          REPO_URL: https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
        run: |
          echo "state folder on the data branch: $STATE/"
          mkdir -p code/data/paper
          if git clone --quiet --depth 1 --branch data "$REPO_URL" "$RUNNER_TEMP/restore" 2>/dev/null \
             && [ -d "$RUNNER_TEMP/restore/$STATE" ]; then
            cp -r "$RUNNER_TEMP/restore/$STATE/." code/data/paper/
            echo "restored: $(ls code/data/paper | tr '\n' ' ')"
          else
            echo "no saved state in $STATE/ yet: starting fresh"
          fi

      - name: Paper-trade today's ladder
        id: run
        working-directory: code
        run: |
          set -o pipefail
          mkdir -p data/paper/logs
          log="data/paper/logs/$(date -u +%Y-%m-%d_%H%M).log"
          args=()
          if [ "${{ inputs.force }}" = "true" ]; then args+=(--force); fi
          if [ -n "${{ inputs.max_minutes }}" ]; then args+=(--max-minutes "${{ inputs.max_minutes }}"); fi
          pmengine paper-day --config paper.yaml --state-dir data/paper "${args[@]}" 2>&1 | tee "$log"
          if grep -q '^skip:' "$log"; then
            rm "$log"
            echo "skipped=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Save paper state to the data branch
        if: always() && steps.run.outputs.skipped != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash code/.github/scripts/push-data.sh code/data/paper "$STATE" "$STATE day $(date -u +%Y-%m-%d)"

      - name: Summary
        if: always() && steps.run.outputs.skipped != 'true'
        run: |
          {
            echo "### Paper trading ($STATE/)"
            echo '```'
            cat code/data/paper/summary.csv 2>/dev/null | tail -15 || echo "no summary yet"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
